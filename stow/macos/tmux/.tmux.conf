set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,ghostty:RGB"

set -g mouse off
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g renumber-windows on
set -g history-limit 50000

set -g set-clipboard on
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour254,fg=colour238"
set -g status-left-length 30
set -g status-left "#[bold] #S #[default]"
set -g status-right-length 100
set -g status-right "#[fg=colour244]#H #[fg=colour250]| #[fg=colour238]#{pane_current_path} #[fg=colour250]| #[fg=colour238]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour250,fg=colour16,bold] #I:#W #[default]"
